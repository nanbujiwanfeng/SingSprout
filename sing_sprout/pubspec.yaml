name: sing_sprout
description: 声芽 SingSprout - AI音乐启蒙创作工具 · 金松果音乐游戏 · 虚拟物品兑换
version: 1.0.2+12
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  http: ^1.1.2
  uuid: ^4.2.1
  flutter_animate: ^4.3.0
  crypto: ^3.0.3
  path_provider: ^2.1.1
  path: ^1.8.3
  sqflite: ^2.3.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.0
  just_audio: ^0.9.40
  share_plus: ^12.0.2
  archive: ^3.6.1
  record: ^5.2.1
  audioplayers: ^5.2.1
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  flutter_staggered_grid_view: ^0.7.0
  tflite_flutter: 0.11.0
  package_info_plus: ^9.0.1
dependency_overrides:
  record_linux: 1.3.1
flutter:
  uses-material-design: true
  assets:
    # Basic Pitch TFLite for on-device pitch detection (~0.84MB).
    - assets/models/basicpitch.tflite
    # YAMNet TFLite (~1.5MB) — on-device sound classification (521 AudioSet classes).
    # When missing, SoundClassificationService falls back to SenseVoice cloud API.
    - assets/models/yamnet.tflite
    - assets/models/yamnet_class_map.csv

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.3
  mocktail: ^1.0.4
  path_provider_platform_interface: any
